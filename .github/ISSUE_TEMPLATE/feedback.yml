name: Feedback
description: Confusing docs, missing API, or a suggestion (not a crash)
title: "[Feedback] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Docs, naming, and coverage notes are useful even without a bug.

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Docs / README unclear
        - Missing or surprising API
        - Install / packaging
        - Other
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: What you were trying to do and what was missing or confusing.
    validations:
      required: true
