name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Sync (incl. test deps)
        run: uv sync --group dev

      - name: Pytest
        run: uv run pytest

      - name: Smoke (metered mock)
        run: uv run python scripts/smoke_meter_mock.py
