name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync (incl. test deps)
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Pytest
        run: |
          set -euo pipefail
          py="${{ matrix.python-version }}"
          uv run --python "$py" python - "$py" << 'PY'
          import re
          import subprocess
          import sys

          py = sys.argv[1]
          summary_re = re.compile(
              r"(?P<body>\d+ (?:failed|passed|skipped|error|errors|xfailed|xpassed|warnings|deselected)"
              r"(?:, \d+ (?:failed|passed|skipped|error|errors|xfailed|xpassed|warnings|deselected))*)"
              r" in (?P<seconds>[0-9.]+)s"
          )
          count_re = re.compile(
              r"(\d+) (failed|passed|skipped|error|errors|xfailed|xpassed|warnings|deselected)"
          )
          collect_re = re.compile(r"^(tests/\S+::\S+)\s*$")
          status_re = re.compile(r"\b(PASSED|FAILED|SKIPPED|ERROR|XFAIL|XPASS)\b")
          node_re = re.compile(r"(tests/\S+::\S+)")
          tally_names = ("failed", "passed", "skipped", "error", "xfailed", "xpassed")

          def run(args: list[str]) -> subprocess.CompletedProcess[str]:
              cmd = ["uv", "run", "--python", py, "pytest", *args]
              print("+", " ".join(cmd), flush=True)
              return subprocess.run(cmd, text=True, capture_output=True)

          def collected_ids(proc: subprocess.CompletedProcess[str]) -> list[str]:
              ids: list[str] = []
              for line in proc.stdout.splitlines():
                  match = collect_re.match(line.strip())
                  if match:
                      ids.append(match.group(1))
              return ids

          def executed_ids(proc: subprocess.CompletedProcess[str]) -> set[str]:
              found: set[str] = set()
              for line in (proc.stdout + "\n" + proc.stderr).splitlines():
                  if status_re.search(line) is None:
                      continue
                  for match in node_re.finditer(line):
                      found.add(match.group(1).rstrip("."))
              return found

          def counts(proc: subprocess.CompletedProcess[str]) -> dict[str, str]:
              text = proc.stdout + "\n" + proc.stderr
              found = list(summary_re.finditer(text))
              if not found:
                  print(text[-4000:])
                  raise SystemExit("pytest summary line missing")
              body = found[-1].group("body")
              seconds = found[-1].group("seconds")
              print("SUMMARY", body, "in", seconds + "s")
              tallies = {name: "0" for name in tally_names}
              for number, name in count_re.findall(body):
                  key = "error" if name == "errors" else name
                  if key in tallies:
                      tallies[key] = number
              collected = sum(int(tallies[name]) for name in tally_names)
              return {
                  "collected": str(collected),
                  "passed": tallies["passed"],
                  "failed": tallies["failed"],
                  "skipped": tallies["skipped"],
                  "error": tallies["error"],
                  "seconds": seconds,
                  "summary": f"{body} in {seconds}s",
              }

          def show_diff(label: str, left: set[str], right: set[str]) -> None:
              only_left = sorted(left - right)
              only_right = sorted(right - left)
              print(label, "only_left", len(only_left), "only_right", len(only_right))
              for node_id in only_left[:40]:
                  print(" L", node_id)
              for node_id in only_right[:40]:
                  print(" R", node_id)

          collect = run(["--collect-only", "-q"])
          print(collect.stdout)
          print(collect.stderr, file=sys.stderr)
          if collect.returncode != 0:
              raise SystemExit("collect-only failed")
          collect_ids = collected_ids(collect)
          collect_set = set(collect_ids)
          if len(collect_ids) != len(collect_set):
              raise SystemExit("collect-only node ids are not unique")

          serial = run(["-v", "--tb=short"])
          print(serial.stdout)
          print(serial.stderr, file=sys.stderr)
          xdist = run(["-n", "auto", "-v", "--tb=short"])
          print(xdist.stdout)
          print(xdist.stderr, file=sys.stderr)
          serial_ids = executed_ids(serial)
          xdist_ids = executed_ids(xdist)
          serial_counts = counts(serial)
          xdist_counts = counts(xdist)
          print("::group::node ids")
          for node_id in sorted(collect_set):
              print(node_id)
          print("::endgroup::")
          print(
              "SERIAL",
              f"collected={serial_counts['collected']}",
              f"passed={serial_counts['passed']}",
              f"failed={serial_counts['failed']}",
              f"skipped={serial_counts['skipped']}",
              f"error={serial_counts['error']}",
              f"seconds={serial_counts['seconds']}",
              f"node_ids={len(serial_ids)}",
          )
          print(
              "XDIST",
              f"collected={xdist_counts['collected']}",
              f"passed={xdist_counts['passed']}",
              f"failed={xdist_counts['failed']}",
              f"skipped={xdist_counts['skipped']}",
              f"error={xdist_counts['error']}",
              f"seconds={xdist_counts['seconds']}",
              f"node_ids={len(xdist_ids)}",
          )
          print("COLLECT_NODE_IDS", len(collect_set))
          equal = collect_set == serial_ids == xdist_ids
          print("NODE_ID_SET_EQUAL", equal)
          if not equal:
              show_diff("serial_vs_collect", serial_ids, collect_set)
              show_diff("xdist_vs_collect", xdist_ids, collect_set)
              show_diff("serial_vs_xdist", serial_ids, xdist_ids)
          count_fields = ("collected", "passed", "failed", "skipped", "error")
          counts_equal = all(serial_counts[name] == xdist_counts[name] for name in count_fields)
          print("COUNTS_EQUAL", counts_equal)
          print("SERIAL_SUMMARY", serial_counts["summary"])
          print("XDIST_SUMMARY", xdist_counts["summary"])
          if serial.returncode != 0 or xdist.returncode != 0 or not equal or not counts_equal:
              raise SystemExit("serial and xdist results differ")
          if len(collect_set) != int(serial_counts["collected"]):
              raise SystemExit("collected count does not match the node id set")
          PY

      - name: Smoke (metered mock)
        run: uv run --python ${{ matrix.python-version }} python scripts/smoke_meter_mock.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Build sdist and wheel
        run: uv build

      - name: Wheel has package, not docs/
        run: |
          uv run python - <<'PY'
          import glob, zipfile
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel"
          names = zipfile.ZipFile(wheels[0]).namelist()
          assert any(n.startswith("xaikit/") for n in names), names[:20]
          assert any(n.endswith("xaikit/py.typed") for n in names), names
          leaked = [n for n in names if n.startswith("docs/") or "/templates/" in n]
          assert not leaked, leaked
          print("wheel ok:", wheels[0], "files", len(names))
          PY

      - name: Import from installed wheel
        run: |
          wheel=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$wheel" \
            python -c "import xaikit; from xaikit import XaiClient; print(xaikit.__version__)"

      - name: Pytest against installed wheel
        run: |
          wheel=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$wheel" --with pytest \
            pytest tests -o pythonpath= -m "not live"
