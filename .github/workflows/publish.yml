name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Build
        run: uv build

      - name: Smoke import (wheel)
        run: |
          wheel=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$wheel" \
            python -c "import xaikit; print(xaikit.__version__)"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/xaikit-py/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Publish
        run: uv publish --trusted-publishing always
