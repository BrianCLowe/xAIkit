name: Watch xAI models

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: watch-xai-models
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Scan public xAI docs
        id: scan
        run: |
          set +e
          uv run python scripts/watch_xai_models.py --github-output "$GITHUB_OUTPUT" \
            --write-prices scripts/data/xai_public_prices.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Open issue for tokens not already listed
        if: steps.scan.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SLUGS: ${{ steps.scan.outputs.new_slugs }}
          NEW_RES: ${{ steps.scan.outputs.new_resolutions }}
        run: |
          set -euo pipefail
          gh label create xai-models --description "Public xAI model/docs drift" --color 1D76DB --force
          issues_json="$(mktemp)"
          enriched="$(mktemp)"
          gh issue list --label xai-models --state open --limit 100 \
            --json number,title,body > "$issues_json"
          uv run python - "$issues_json" "$enriched" << 'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          src, dest = sys.argv[1], sys.argv[2]
          issues = json.loads(Path(src).read_text(encoding="utf-8") or "[]")
          for issue in issues:
              raw = subprocess.check_output(
                  ["gh", "issue", "view", str(issue["number"]), "--json", "comments"],
                  text=True,
              )
              comments = json.loads(raw).get("comments") or []
              issue["comments"] = "\n".join(
                  (comment.get("body") or "") for comment in comments
              )
          Path(dest).write_text(json.dumps(issues), encoding="utf-8")
          PY
          filtered="$(uv run python scripts/watch_xai_models.py --select-unlisted \
            --slugs "$NEW_SLUGS" \
            --resolutions "$NEW_RES" \
            --issues-json "$enriched")"
          slugs="$(printf '%s\n' "$filtered" | sed -n 's/^slugs=//p')"
          res="$(printf '%s\n' "$filtered" | sed -n 's/^resolutions=//p')"
          if [ -z "$slugs" ] && [ -z "$res" ]; then
            echo "new tokens already listed on an open xai-models issue"
            exit 0
          fi
          title="xAI public docs added models or resolutions"
          body="$(cat <<EOF
          Public xAI docs drifted from \`scripts/data/xai_models_watch.json\`.

          **New slugs:** \`${slugs:-none}\`
          **New resolutions:** \`${res:-none}\`

          Check whether the kit needs a knob / family / price update:

          - [ ] Catalog family rules (\`thought_level\`, non-reasoning, 4.6+)
          - [ ] Imagine \`quality\` / \`resolution\` (2.0 vs later; 4k?)
          - [ ] Video 1080p contraction / new caps
          - [ ] \`pricing.py\` defaults + \`PRICE_TABLE_FETCHED\`
          - [ ] \`BOOTSTRAP_MODEL\` only if the offline fallback should move (a live unpinned client follows the list within an hour)
          - [ ] Refresh baseline: \`uv run python scripts/watch_xai_models.py --write-baseline\`

          Sources: models, pricing, Imagine image + video generation pages. Release notes are not scanned.
          EOF
          )"
          gh issue create --title "$title" --label xai-models --body "$body"
          echo "opened xai-models issue for slugs=${slugs:-none} resolutions=${res:-none}"

      - name: Commit price gap file when the extract changes
        if: steps.scan.outputs.exit_code != '1'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! uv run python -c 'import json,sys; from pathlib import Path; d=json.loads(Path("scripts/data/xai_public_prices.json").read_text()); sys.exit(0 if d.get("models") else 1)'; then
            echo "refusing to commit an empty public price gap file"
            exit 1
          fi
          git add scripts/data/xai_public_prices.json
          if git diff --cached --quiet; then
            echo "public price gap file unchanged"
            exit 0
          fi
          git commit -m "Update xAI public price gap file"
          git push

      - name: Fail fetch errors
        if: steps.scan.outputs.exit_code == '1'
        run: |
          echo "watch_xai_models.py failed to fetch public docs"
          exit 1
