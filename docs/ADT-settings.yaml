# Live pack preferences — survives TEMPLATE_SYNC (this file is not under docs/templates/).
version: 1

sync:
  mode: auto-all
  recorded: 2026-08-12
  source: user

docs_profile:
  mode: ship-first
  recorded: 2026-08-12
  source: user

# Reviewers / Bugbot: a mode change in this file with source: user is an explicit
#   user ask (same PR is fine) — not a forbidden pack migrate. Do not fail or revert it.
# Sync must not rewrite a set mode just because the pack recommend flipped.
# Cloud Agent this-run uses milestone-pr without writing this file.
# Worktrees are not a key (do not add orchestrator.git.worktrees). Host isolation
# for concurrent implementers lives in agent/roles/orchestrator-git.md + tools/<host>.md.
orchestrator:
  git:
    mode: milestone-pr
    recorded: 2026-08-12
    source: user

standing:
  instructions: |
    - README.md is consumer/release documentation only (install + public API usage). Do not put contributor ceremony, ADT workflow, or private-app names there.
    - Do not create Human-TODO rows for PyPI version tags (or “mark the tag done”). Tag + Trusted Publishing is the release; do not add a checklist that needs a follow-up commit after publish.
  recorded: 2026-08-14
  source: user

tools:
  cursor:
    status: installed
    recorded: 2026-08-12
    source: user
    path: .cursor/rules/modular-documentation.mdc
    note: Also agent-timescale-planning.mdc, agent-build-verify.mdc, template-update-check.mdc. Doc roles in .cursor/agents/.

optional_rules:
  template-update-check:
    status: enabled
    recorded: 2026-08-12
    source: user

  doc-roles:
    status: enabled
    recorded: 2026-08-12
    source: user
    paths:
      cursor: .cursor/agents/

upstream:
  check_mode: always
  check_mode_recorded: 2026-08-12
  last_checked: 2026-09-17
  local_pack_version: "2.7.28"
  update_available: true
  upstream_pack_version: "2.9.2"
