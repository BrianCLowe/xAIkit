sync:
  mode: auto-all
  recorded: 2026-08-12
  source: user

docs_profile:
  mode: ship-first
  recorded: 2026-08-12
  source: user

# Reviewers / Bugbot: a mode change in this file with source: user is an explicit
#   user ask (same PR is fine) — not a forbidden pack migrate. Do not fail or revert it.
# Sync must not rewrite a set mode just because the pack recommend flipped.
# Cloud Agent this-run uses milestone-pr without writing this file.
orchestrator:
  git:
    mode: milestone-pr
    recorded: 2026-08-12
    source: user

standing:
  instructions: |
    - README.md is consumer/release documentation only (install + public API usage). Do not put contributor ceremony, ADT workflow, or private-app names there.
    - Live docs under docs/ and docs/templates/ stay in git; they must not ship in the installed wheel.
    - Prove library wiring with offline contract tests (mock provider + mocked HTTP). Do not add a playground UI for knob/media verification.
    - Keep examples and tests generic — no private consumer project names.
    - Keep xaikit requires-python in lockstep with xai-sdk (currently >=3.10). Do not raise the floor above the SDK; pin transitive deps so they still install on that floor.
    - Do not create Human-TODO rows for PyPI version tags (or “mark the tag done”). Tag + Trusted Publishing is the release; do not add a checklist that needs a follow-up commit after publish.
  recorded: 2026-08-14
  source: user

