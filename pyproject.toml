[project]
name = "xaikit"
version = "0.1.0"
description = "Extractable xAI transport + catalog + connect + usage metering kit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<4.0"
authors = [{ name = "Brian Lowe" }]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "xai-sdk>=1.17.0",
]

[project.urls]
Homepage = "https://github.com/BrianCLowe/xAIkit"
Repository = "https://github.com/BrianCLowe/xAIkit"

[project.scripts]
xaikit-gaps = "xaikit.gaps:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: hits the live xAI API (requires XAI_API_KEY and XAITKIT_LIVE=1)",
]
