[project]
name = "xaikit-py"
version = "0.1.0a1"
description = "Unofficial Python kit for the xAI (Grok) API: typed client, catalog, usage metering, media, and realtime voice"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
authors = [{ name = "Brian Lowe" }]
keywords = ["grok", "grok-api", "xai", "llm", "sdk", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    # 17.x dropped 3.10; stay on the SDK floor until xai-sdk raises it.
    "websockets>=14.0,<17",
    "xai-sdk>=1.17.0",
]

[project.urls]
Homepage = "https://github.com/BrianCLowe/xAIkit"
Repository = "https://github.com/BrianCLowe/xAIkit"
Issues = "https://github.com/BrianCLowe/xAIkit/issues"
"Release notes" = "https://github.com/BrianCLowe/xAIkit/releases"

[project.scripts]
xaikit-gaps = "xaikit.gaps:main"

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xaikit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: hits the live xAI API (requires XAI_API_KEY and XAITKIT_LIVE=1)",
]
